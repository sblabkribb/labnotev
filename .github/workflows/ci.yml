name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview-section && npm ci

      # Mandatory gates: a red result here fails the build.
      - name: Typecheck (host)
        run: npm run typecheck

      - name: Run tests (host + webview)
        run: npm run test:all

      - name: Build extension
        run: npm run build

      # Advisory checks: surfaced in logs but do not fail the build yet, since
      # the webview typecheck and the lint baseline still have pre-existing
      # violations to be addressed incrementally.
      - name: Typecheck (webview, advisory)
        run: npm run typecheck:webview
        continue-on-error: true

      - name: Lint (advisory)
        run: npm run lint:all
        continue-on-error: true
