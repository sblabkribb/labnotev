name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # Single root lock file now covers all workspaces
          # (packages/*, webview-section) via npm workspaces.
          cache-dependency-path: package-lock.json

      - name: Install dependencies (all workspaces)
        run: npm ci

      # Mandatory gates: a red result here fails the build.
      - name: Typecheck (host + webview)
        run: npm run typecheck:all

      - name: Run tests (host + webview)
        run: npm run test:all

      - name: Build extension
        run: npm run build

      - name: Build Obsidian plugin
        run: npm run build:obsidian

      # Mandatory gate: fails on ESLint errors. Warnings are still allowed
      # (ESLint exits 0 on warnings) so the remaining advisory warnings do not
      # block the build.
      - name: Lint (host + webview)
        run: npm run lint:all
