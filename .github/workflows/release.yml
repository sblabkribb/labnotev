name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install webview dependencies
        run: cd webview && npm ci
      
      - name: Build extension
        run: npm run build
      
      - name: Package Extension
        run: npx @vscode/vsce package --no-dependencies
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.vsix'
          name: Lab Note Editor v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 설치 방법
            
            ### 방법 1: 명령줄
            ```bash
            code --install-extension labnotev-${{ steps.get_version.outputs.VERSION }}.vsix
            ```
            
            ### 방법 2: VS Code에서 직접 설치
            1. `.vsix` 파일 다운로드
            2. VS Code 열기
            3. `Ctrl+Shift+P` → "Extensions: Install from VSIX..." 선택
            4. 다운로드한 파일 선택
            
            ## 변경 사항
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 참조
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
